name: Publish FarmCrew to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript and job timers
        run: |
          node --check app.js
          node tests/timers.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css FarmCrew.html .nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
